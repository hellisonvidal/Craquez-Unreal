# Android Build Workflow for Craquez Football Game
# Triggers on push to main, pull requests, and version tags
# Builds APK and AAB for distribution

name: Android Build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      upload_to_release:
        description: 'Upload to GitHub Release (for tags only)'
        required: false
        default: true
        type: boolean

env:
  # Unreal Engine version
  UE_VERSION: '5.4'
  # Android SDK/NDK versions
  ANDROID_SDK_VERSION: '33'
  ANDROID_NDK_VERSION: 'r25c'
  # Java version
  JAVA_VERSION: '17'
  # Gradle version
  GRADLE_VERSION: '8.1'
  # Android project directory (Unreal generates this at Build/Android/)
  ANDROID_PROJECT_DIR: 'Build/Android'
  # Gradle options for CI
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true -Dorg.gradle.jvmargs="-Xmx2g -XX:+HeapDumpOnOutOfMemoryError"'

jobs:
  # Setup and cache dependencies - NO gradle setup action, only cache
  setup:
    name: Setup & Validate
    runs-on: ubuntu-latest
    outputs:
      gradle_cache_key: ${{ steps.gradle_cache.outputs.cache_key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          # Don't use gradle cache here - we'll cache manually
          # cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          # Explicitly specify packages to install - avoid deprecated 'tools' package
          platforms: android-${{ env.ANDROID_SDK_VERSION }}
          # Don't install deprecated 'tools' package - use cmdline-tools instead

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --list | grep -E "(platforms;android-${{ env.ANDROID_SDK_VERSION }}|build-tools|ndk;${{ env.ANDROID_NDK_VERSION }})" || true

      - name: Verify Android Project Structure
        run: |
          ls -la ${{ env.ANDROID_PROJECT_DIR }}/
          test -f ${{ env.ANDROID_PROJECT_DIR }}/gradlew && echo "✓ gradlew exists"
          test -f ${{ env.ANDROID_PROJECT_DIR }}/gradle/wrapper/gradle-wrapper.properties && echo "✓ gradle-wrapper.properties exists"
          test -f ${{ env.ANDROID_PROJECT_DIR }}/build.gradle && echo "✓ build.gradle exists"
          test -f ${{ env.ANDROID_PROJECT_DIR }}/settings.gradle && echo "✓ settings.gradle exists"

      - name: Cache Gradle
        id: gradle_cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/.gradle
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Build/Android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('Build/Android/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

  # Build Android APK
  build-apk:
    name: Build APK
    needs: setup
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        shell: bash
    env:
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true -Dorg.gradle.jvmargs="-Xmx2g -XX:+HeapDumpOnOutOfMemoryError"'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          # No gradle cache - using wrapper directly

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          # Explicitly specify platforms to install - avoid deprecated 'tools' package
          platforms: android-${{ env.ANDROID_SDK_VERSION }}

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/.gradle
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ needs.setup.outputs.gradle_cache_key }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Validate Gradle Wrapper
        run: |
          ./gradlew --version
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release' && github.event_name != 'pull_request'
        run: ./gradlew assembleRelease --no-daemon --stacktrace --info

      - name: Upload Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: craquez-debug-apk
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: craquez-release-apk
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload Build Scan (Optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-scan
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/reports/
            .gradle/
          retention-days: 7

  # Build Android App Bundle (AAB) for Play Store
  build-aab:
    name: Build AAB
    needs: setup
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        shell: bash
    env:
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true -Dorg.gradle.jvmargs="-Xmx2g -XX:+HeapDumpOnOutOfMemoryError"'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          # No gradle cache - using wrapper directly

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          platforms: android-${{ env.ANDROID_SDK_VERSION }}

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/.gradle
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ needs.setup.outputs.gradle_cache_key }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace --info

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: craquez-release-aab
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
          retention-days: 90

  # Create GitHub Release with APK/AAB
  create-release:
    name: Create GitHub Release
    needs: [build-apk, build-aab]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: craquez-release-apk
          path: artifacts/apk

      - name: Download Release AAB
        uses: actions/download-artifact@v4
        with:
          name: craquez-release-aab
          path: artifacts/aab

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Craquez ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/apk/*.apk
            artifacts/aab/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Code quality checks
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Run clang-format check
        run: |
          find Plugins/FootballCore/Source -name "*.h" -o -name "*.cpp" | xargs clang-format --dry-run --Werror

      - name: Check for TODO/FIXME
        run: |
          grep -r "TODO\|FIXME" Plugins/FootballCore/Source --include="*.h" --include="*.cpp" || true

      - name: Validate .gitattributes
        run: |
          git check-attr --all Build/Android/**/*.fbx Build/Android/**/*.png

  # Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.47.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'