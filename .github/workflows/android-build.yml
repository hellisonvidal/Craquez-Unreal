# CI & Android Build Workflow for Craquez Football Game
# Triggers on push to main/develop, pull requests, and version tags

name: Android Build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      upload_to_release:
        description: 'Upload to GitHub Release (for tags only)'
        required: false
        default: true
        type: boolean

env:
  UE_VERSION: '5.8'
  ANDROID_SDK_VERSION: '33'
  ANDROID_NDK_VERSION: '25.2.9519653'
  JAVA_VERSION: '17'
  ANDROID_PROJECT_DIR: 'Build/Android'

jobs:
  setup:
    name: Setup & Validate
    runs-on: ubuntu-latest
    outputs:
      has_android_project: ${{ steps.check_android.outputs.has_android_project }}
      gradle_cache_key: ${{ steps.cache_key.outputs.key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Validate Unreal Engine Project Structure
        run: |
          test -f Craquez.uproject && echo "OK: Craquez.uproject"
          test -f Plugins/FootballCore/FootballCore.uplugin && echo "OK: FootballCore.uplugin"
          python3 -m json.tool Craquez.uproject > /dev/null && echo "OK: Craquez.uproject valid JSON"
          python3 -m json.tool Plugins/FootballCore/FootballCore.uplugin > /dev/null && echo "OK: FootballCore.uplugin valid JSON"
          test -f Source/Craquez.Target.cs && echo "OK: Craquez.Target.cs"
          test -f Source/CraquezEditor.Target.cs && echo "OK: CraquezEditor.Target.cs"
          test -f Source/Craquez/Craquez.Build.cs && echo "OK: Craquez.Build.cs"
          for mod in FootballCore FootballCoreGameplay FootballCoreAI FootballCoreNetworking FootballCoreUI; do
            test -f "Plugins/FootballCore/Source/${mod}/${mod}.Build.cs" && echo "OK: ${mod}.Build.cs"
          done

      - name: Check Android Gradle Project Presence
        id: check_android
        run: |
          if [ -f "${{ env.ANDROID_PROJECT_DIR }}/gradlew" ] && [ -f "${{ env.ANDROID_PROJECT_DIR }}/build.gradle" ]; then
            echo "has_android_project=true" >> "$GITHUB_OUTPUT"
            echo "Android Gradle project detected at ${{ env.ANDROID_PROJECT_DIR }}"
          else
            echo "has_android_project=false" >> "$GITHUB_OUTPUT"
            echo "No pre-generated Unreal Android Gradle project in ${{ env.ANDROID_PROJECT_DIR }} (generated by UE5 Packaging). Skipping Gradle APK/AAB build jobs."
          fi

      - name: Compute Gradle Cache Key
        id: cache_key
        if: steps.check_android.outputs.has_android_project == 'true'
        run: |
          echo "key=gradle-${{ runner.os }}-${{ hashFiles('Build/Android/gradle/wrapper/gradle-wrapper.properties', 'Build/Android/build.gradle') }}" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        if: steps.check_android.outputs.has_android_project == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        if: steps.check_android.outputs.has_android_project == 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-${{ env.ANDROID_SDK_VERSION }}" "build-tools;33.0.0" "ndk;${{ env.ANDROID_NDK_VERSION }}" "cmake;3.22.1"

      - name: Cache Gradle
        if: steps.check_android.outputs.has_android_project == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/.gradle
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.cache_key.outputs.key }}
          restore-keys: |
            gradle-${{ runner.os }}-

  build-apk:
    name: Build APK
    needs: setup
    runs-on: ubuntu-latest
    if: needs.setup.outputs.has_android_project == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    defaults:
      run:
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        shell: bash
    env:
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true -Dorg.gradle.jvmargs="-Xmx2g -XX:+HeapDumpOnOutOfMemoryError"'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-${{ env.ANDROID_SDK_VERSION }}" "build-tools;33.0.0" "ndk;${{ env.ANDROID_NDK_VERSION }}" "cmake;3.22.1"

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/.gradle
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ needs.setup.outputs.gradle_cache_key }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Validate Gradle Wrapper
        run: ./gradlew --version

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == '') && github.event_name != 'pull_request'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: craquez-debug-apk
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        if: (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == '') && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: craquez-release-apk
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          retention-days: 90

  build-aab:
    name: Build AAB
    needs: setup
    runs-on: ubuntu-latest
    if: needs.setup.outputs.has_android_project == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    defaults:
      run:
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        shell: bash
    env:
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true -Dorg.gradle.jvmargs="-Xmx2g -XX:+HeapDumpOnOutOfMemoryError"'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-${{ env.ANDROID_SDK_VERSION }}" "build-tools;33.0.0" "ndk;${{ env.ANDROID_NDK_VERSION }}" "cmake;3.22.1"

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/.gradle
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ needs.setup.outputs.gradle_cache_key }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: craquez-release-aab
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
          retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: [setup, build-apk, build-aab]
    if: needs.setup.outputs.has_android_project == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: craquez-release-apk
          path: artifacts/apk

      - name: Download Release AAB
        uses: actions/download-artifact@v4
        with:
          name: craquez-release-aab
          path: artifacts/aab

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Craquez ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/apk/*.apk
            artifacts/aab/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Run clang-format check
        run: |
          find Source Plugins/FootballCore/Source \( -name "*.h" -o -name "*.cpp" \) -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Check for TODO/FIXME
        run: |
          grep -rn "TODO\|FIXME" Source Plugins/FootballCore/Source --include="*.h" --include="*.cpp" || true

      - name: Validate .gitattributes
        run: |
          find Assets -type f \( -name "*.fbx" -o -name "*.png" \) -print0 | xargs -0 git check-attr filter

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
